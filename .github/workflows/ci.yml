# .github/workflows/ci.yml — new job (previewed here, built fully in Lecture 20)
# Section 4.3's generic steps, applied in full: checkout, setup
# environment, install dependencies, build, test, report — for every
# layer of Inkwell's testing pyramid (Lectures 12-14).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Audit server dependencies
        run: npm audit --audit-level=high
        working-directory: server
      - name: Audit client dependencies
        run: npm audit --audit-level=high
        working-directory: client

  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell
          POSTGRES_DB: inkwell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inkwell:inkwell@localhost:5432/inkwell_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up environment
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate
      - name: Apply database migrations
        working-directory: server
        run: npx prisma migrate deploy
      - name: Run tests with coverage
        working-directory: server
        run: npm test -- --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: server/coverage/

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npx vitest run
      - working-directory: client
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell
          POSTGRES_DB: inkwell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inkwell:inkwell@localhost:5432/inkwell_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install dependencies (Playwright, server, client)
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
      - name: Prepare the server and its database
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npx playwright test --project=chromium
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/

  prepare-deployment-artifact:
    runs-on: ubuntu-latest
    needs: [dependency-audit, server-tests, client-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, tag and push the image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inkwell-server:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./server
          docker push "$IMAGE"