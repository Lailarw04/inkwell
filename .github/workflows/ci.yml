# .github/workflows/ci.yml — new job (previewed here, built fully in Lecture 20)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
        working-directory: server