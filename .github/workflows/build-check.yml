# .github/workflows/build-check.yml
#
# Section 4.1's workflow, Section 4.2's anatomy, made concrete for
# the first time — this is intentionally narrow in scope: just confirm
# the Docker image still builds. Lecture 20 expands this dramatically.
name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Section 4.1's "event" — this workflow runs automatically whenever
  # code is pushed to main, or a pull request targets main.
  
permissions:
  contents: read
      # Section 4.2's "permissions": this workflow only reads the code, so
      # its token gets read access and nothing else (least privilege,
      # Lecture 15). A compromised step cannot push commits or edit issues.

jobs:
  docker-build:
    runs-on: ubuntu-latest
    # Section 4.3: a GitHub-hosted runner — a fresh Ubuntu virtual
    # machine, provisioned and torn down automatically by GitHub.
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        # Section 4.2: a reusable ACTION, not a raw shell command —
        # this one is maintained by GitHub itself and handles the
        # (surprisingly fiddly) details of cloning the right commit.
        # "@v5" pins the major version. v4 still works, but it targets
        # Node.js 20, which GitHub has deprecated on its runners, so every
        # run would carry a deprecation warning.

      - name: Build the server Docker image
        run: docker image inspect inkwell-server:ci --format 'Built {{.Id}} ({{.Architecture}}, {{.Size}} bytes)'
        # "docker image inspect" exits with an error if the image does not
        # exist, so this step genuinely fails when there is no image.
        # ("docker images" would not: it prints an empty table and still
        # reports success, so a check built on it could never fail.)

      - name: Confirm the image was built
        run: docker images inkwell-server:ci